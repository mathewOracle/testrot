name: CI

on:
  push:
    branches: [main]
  pull_request:

# uv's managed interpreters are "externally managed" and reject --system, so
# every job installs into an explicit virtualenv that later steps reuse.
env:
  UV_PROJECT_ENVIRONMENT: .venv

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtualenv
        run: |
          uv venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The base install must stay dependency-free, so prove the package and
      # its CLI work before any optional extra is present.
      - name: Install base package only
        run: uv pip install -e .
      - name: Verify base install pulls in no LangChain
        run: |
          python -c "import testrot; print(testrot.__version__)"
          testrot --list-rules
          python - <<'PY'
          try:
              import langchain_core
          except ImportError:
              print("confirmed: base install pulls in no LangChain")
          else:
              raise SystemExit("base install must not depend on langchain-core")
          PY
      - name: testrot scans itself
        run: testrot src/ tests/ examples/

      - name: Install dev and langgraph extras
        run: uv pip install -e ".[dev,langgraph]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Create virtualenv
        run: |
          uv venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: uv pip install build twine
      - run: python -m build
      - name: Validate distribution metadata
        run: twine check --strict dist/*
      - name: Install the built wheel in a clean environment
        run: |
          uv venv /tmp/fresh
          uv pip install --python /tmp/fresh/bin/python dist/*.whl
          /tmp/fresh/bin/testrot --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
