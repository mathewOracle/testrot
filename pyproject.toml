[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testrot"
version = "0.1.0"
description = "Find tests that pass without testing anything."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "mathewOracle" }]
keywords = [
    "testing",
    "static-analysis",
    "ast",
    "linter",
    "code-quality",
    "test-quality",
    "mutation-testing",
    "langchain",
    "langgraph",
    "agent",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
langgraph = ["langchain>=1.0", "langchain-core>=0.3", "langgraph>=0.2"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "build>=1.2"]

[project.scripts]
testrot = "testrot.cli:main"

[project.urls]
Homepage = "https://github.com/mathewOracle/testrot"
Repository = "https://github.com/mathewOracle/testrot"
Issues = "https://github.com/mathewOracle/testrot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/testrot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

# The LangGraph bridge is an optional extra, so its imports and untyped
# decorators must not fail a base-install type check.
[[tool.mypy.overrides]]
module = "testrot.langgraph"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["langchain.*", "langchain_core.*", "langgraph.*"]
ignore_missing_imports = true
